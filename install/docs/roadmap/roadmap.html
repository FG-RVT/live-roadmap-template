<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live roadmap</title>
  <meta name="description" content="What is being built right now, what comes next, and how far it is to the release.">
  <meta name="theme-color" content="#fafafa">
  <script>try { if (localStorage.getItem("live-roadmap-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (error) { /* Storage is optional. */ }</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 22h10M13 22c6 0 6-12 12-12M13 22c6 0 6 4 12 4' fill='none' stroke='%23ff5a36' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='13' cy='22' r='3' fill='%23ff5a36'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="roadmap.css">
</head>
<body>
  <a class="lr-skip" href="#timeline" data-ui="skip">Skip to the timeline</a>

  <header class="lr-header">
    <a class="lr-brand" id="lrBrand" href="#">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 22h10M13 22c6 0 6-12 12-12M13 22c6 0 6 4 12 4"/><circle cx="13" cy="22" r="3"/></svg>
      <span id="lrProject"></span>
    </a>
    <nav class="lr-nav" aria-label="Sections" data-ui-aria="navLabel">
      <a href="#timeline" data-ui="navTimeline">Timeline</a>
      <a href="#now" data-ui="navNow">Current</a>
      <a href="#scope" data-ui="navScope">Full scope</a>
    </nav>
    <div class="lr-status" id="lrStatus" hidden>
      <button type="button" class="lr-status-pill" aria-describedby="lrStatusTip"><i aria-hidden="true"></i><span id="lrStatusLabel"></span></button>
      <div class="lr-status-tip" id="lrStatusTip" role="tooltip"></div>
    </div>
    <div class="lr-lang" id="lrLang" role="group" aria-label="Language" data-ui-aria="langLabel"></div>
    <button type="button" class="lr-theme" id="lrTheme" aria-pressed="false" aria-label="Dark mode" data-ui-aria="themeLabel">
      <svg class="lr-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="lr-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main id="main">
    <h1 class="lr-sr" id="lrHeading">Live roadmap</h1>

    <section class="lr-timeline" id="timeline" aria-labelledby="lrTimelineLabel">
      <h2 class="lr-sr" id="lrTimelineLabel" data-ui="timeline">Timeline</h2>
      <div class="lr-stage" id="lrStage">
        <svg id="lrSvg" class="lr-svg" tabindex="0" role="img" aria-labelledby="lrSvgTitle" aria-describedby="lrHint"><title id="lrSvgTitle"></title><g id="lrDraw"></g></svg>
        <p class="lr-missing" id="lrMissing" hidden>No roadmap data yet. Build it in the repository with <code>node tools/roadmap/build.mjs</code> (a local install: <code>node .roadmap/tools/roadmap/build.mjs</code>).</p>
      </div>
      <div class="lr-controls lr-pad">
        <p class="lr-hint" id="lrHint" data-ui="hint"></p>
        <ul class="lr-legend" aria-label="Legend" data-ui-aria="legendLabel">
          <li><i class="lr-dot is-done"></i><span data-ui="status.done"></span></li>
          <li><i class="lr-dot is-active"></i><span data-ui="status.active"></span></li>
          <li><i class="lr-dot is-next"></i><span data-ui="status.next"></span></li>
          <li><i class="lr-dot is-later"></i><span data-ui="status.later"></span></li>
        </ul>
        <button type="button" class="lr-now-btn" id="lrNowBtn" data-ui="now">Now</button>
      </div>
      <div class="lr-focus lr-pad" id="lrFocus" aria-live="polite"></div>
    </section>

    <section class="lr-section lr-pad" id="now">
      <div class="lr-cols">
        <div><p class="lr-overline" data-ui="activeTitle"></p><div id="lrActive"></div></div>
        <div><p class="lr-overline" data-ui="nextTitle"></p><div id="lrNext"></div></div>
        <div><p class="lr-overline" data-ui="waitingTitle"></p><div id="lrWaiting"></div></div>
      </div>
    </section>

    <section class="lr-section lr-pad" id="scope">
      <p class="lr-overline" data-ui="scopeTitle"></p>
      <div id="lrScope" class="lr-scope"></div>
    </section>

    <section class="lr-section lr-pad" id="recent">
      <p class="lr-overline" data-ui="recentTitle"></p>
      <ol id="lrRecent" class="lr-recent"></ol>
    </section>
  </main>

  <footer class="lr-footer lr-pad"><span data-ui="footer"></span></footer>

  <script src="roadmap-data.js"></script>
  <script src="roadmap.js"></script>
</body>
</html>
